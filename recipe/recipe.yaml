schema_version: 1

context:
  name: darabonba-core
  version: "1.0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: c2de2ee260682b4c08c9ec67793de66a2bdf316363b9165f152b9acaa16b4dc3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - alibabacloud-tea
    - requests >=2.21.0,<3.0.0
    - aiohttp >=3.7.0,<4.0.0

tests:
  - python:
      imports:
        - darabonba
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: The darabonba module of alibabaCloud Python SDK.
  license: Apache-2.0
  license_file: LICENSE-2.0.txt
  homepage: https://github.com/aliyun/tea-python
  repository: https://github.com/aliyun/tea-python
  documentation: https://github.com/aliyun/tea-python/blob/master/README.md

extra:
  recipe-maintainers:
    - xylar
